name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run TypeScript type check
      run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: .next

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint --if-present

  performance:
    name: Performance Budgets
    runs-on: ubuntu-latest
    needs: [typecheck, build]
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

    - name: Start production server
      run: npm start &
      sleep 10

    - name: Run Lighthouse CI
      run: lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: .lighthouseci/

  budget-check:
    name: Performance Budget Validation
    runs-on: ubuntu-latest
    needs: [typecheck, build]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install additional packages
      run: npm install -g lighthouse @lhci/cli

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

    - name: Run performance budget checks
      run: |
        # Install Node.js dependencies for performance budgets
        npm install -g lighthouse-cli
        
        # Define performance budgets as shell variables for easy configuration
        BUDGET_CHECKS=0
        
        # Function to check a single URL
        check_url_performance() {
          local url=$1
          local page_name=$2
          echo "Running performance check for: $page_name ($url)"
          
          # Run Lighthouse with specific budgets
          lighthouse $url \
            --chrome-flags="--headless" \
            --only-categories=performance,accessibility,best-practices,seo \
            --budgets-file=performance-budgets.config.js \
            --output-path=./budget-results/$page_name.json \
            --output=json \
            --quiet
            
          # Check if the command succeeded
          if [ $? -eq 0 ]; then
            echo "✅ $page_name performance check completed"
            
            # Extract key metrics and validate budgets
            local lcp=$(node -e "const data = require('./budget-results/$page_name.json'); console.log(data.lhr.audits['largest-contentful-paint'].numericValue || 0)")
            local cls=$(node -e "const data = require('./budget-results/$page_name.json'); console.log(data.lhr.audits['cumulative-layout-shift'].numericValue || 0)")
            local tbt=$(node -e "const data = require('./budget-results/$page_name.json'); console.log(data.lhr.audits['total-blocking-time'].totalBlockingTime || 0)")
            local perf_score=$(node -e "const data = require('./budget-results/$page_name.json'); console.log((data.lhr.categories.performance.score || 0) * 100)")
            
            echo "Metrics for $page_name: LCP=${lcp}ms, CLS=${cls}, TBT=${tbt}ms, Score=${perf_score}%"
            
            # Validate against budgets
            local failures=0
            
            # LCP check (2.5s limit for most pages)
            if (( $(echo "$lcp > 2500" | bc -l) )); then
              echo "❌ LCP ($lcpms) exceeds budget (2500ms) for $page_name"
              failures=$((failures + 1))
            fi
            
            # CLS check (0.1 limit)
            if (( $(echo "$cls > 0.1" | bc -l) )); then
              echo "❌ CLS ($cls) exceeds budget (0.1) for $page_name"
              failures=$((failures + 1))
            fi
            
            # TBT check (600ms limit)
            if (( $(echo "$tbt > 600" | bc -l) )); then
              echo "❌ TBT (${tbt}ms) exceeds budget (600ms) for $page_name"
              failures=$((failures + 1))
            fi
            
            # Performance score check (75% minimum)
            if (( $(echo "$perf_score < 75" | bc -l) )); then
              echo "❌ Performance score (${perf_score}%) below budget (75%) for $page_name"
              failures=$((failures + 1))
            fi
            
            if [ $failures -eq 0 ]; then
              echo "✅ All budgets passed for $page_name"
            else
              echo "❌ $failures budget failures for $page_name"
              BUDGET_CHECKS=$((BUDGET_CHECKS + 1))
            fi
          else
            echo "❌ Performance check failed for $page_name"
            BUDGET_CHECKS=$((BUDGET_CHECKS + 1))
          fi
        }
        
        # Create results directory
        mkdir -p budget-results
        
        # Test key pages
        check_url_performance "https://info.sailboats.fr/" "Homepage"
        check_url_performance "https://info.sailboats.fr/yachts" "Yachts Page"
        check_url_performance "https://info.sailboats.fr/compare" "Compare Page"
        check_url_performance "https://info.sailboats.fr/search" "Search Page"
        
        # Summary
        echo ""
        echo "======================================"
        echo "PERFORMANCE BUDGET CHECK SUMMARY"
        echo "======================================"
        if [ $BUDGET_CHECKS -eq 0 ]; then
          echo "✅ All performance budgets passed!"
          exit 0
        else
          echo "❌ $BUDGET_CHECKS page(s) failed performance budgets"
          echo "Please review the output above for details."
          exit 1
        fi