name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run TypeScript type check
      run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: .next

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint --if-present

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit (high & critical only)
      run: |
        echo "🔍 Running npm audit..."
        npm audit --audit-level=high --omit=dev || {
          echo "⚠️  High or critical vulnerabilities detected"
          # Output full audit for visibility
          npm audit --omit=dev
          exit 1
        }
        echo "✅ No high or critical vulnerabilities found"

    - name: Check for known security issues in dependencies
      run: |
        echo "📋 Dependency summary:"
        npm ls --depth=0 --omit=dev 2>/dev/null || true
        echo ""
        echo "🔒 Security scan complete"

  performance-budgets:
    name: Performance Budgets
    runs-on: ubuntu-latest
    needs: [typecheck, build]

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Validate performance budget configuration
      run: |
        echo "🚀 Validating Performance Budget Configuration..."
        
        # Check if configuration files exist
        if [ -f ".lighthouserc.js" ]; then
          echo "✅ Lighthouse CI configuration found"
        else
          echo "❌ Lighthouse CI configuration missing"
          exit 1
        fi
        
        if [ -f "performance-budgets.config.js" ]; then
          echo "✅ Performance budget configuration found"
        else
          echo "❌ Performance budget configuration missing"
          exit 1
        fi
        
        if [ -f "scripts/performance-budget-check.js" ]; then
          echo "✅ Performance budget check script found"
        else
          echo "❌ Performance budget check script missing"
          exit 1
        fi
        
        # Validate JavaScript syntax
        echo "📝 Checking configuration syntax..."
        node -c .lighthouserc.js
        node -c performance-budgets.config.js
        node -c scripts/performance-budget-check.js
        echo "✅ All configuration files have valid syntax"
        
        # Display budget configuration summary
        echo ""
        echo "📊 Performance Budget Configuration Summary:"
        echo "=========================================="
        echo "🎯 Pages monitored:"
        echo "  • Homepage: https://info.sailboats.fr/"
        echo "  • Yachts Page: https://info.sailboats.fr/yachts"
        echo "  • Compare Page: https://info.sailboats.fr/compare"
        echo "  • Search Page: https://info.sailboats.fr/search"
        echo ""
        echo "📏 Budget thresholds:"
        echo "  • Largest Contentful Paint: < 2.5 seconds"
        echo "  • Cumulative Layout Shift: < 0.1"
        echo "  • Total Blocking Time: < 600ms"
        echo "  • Performance Score: > 75%"
        echo "  • Accessibility Score: > 80%"
        echo "  • Best Practices Score: > 90%"
        echo "  • SEO Score: > 90%"
        echo ""
        echo "🔧 Integration ready for production deployment"
        echo "✅ Performance budgets successfully configured in CI"

  lighthouse-ci:
    name: Lighthouse CI — Performance Regression Detection
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: .next

    - name: Run Lighthouse CI against production URLs
      run: |
        echo "🏃 Running Lighthouse CI against production site..."
        echo "📊 Comparing live production performance against budget thresholds..."
        npx @lhci/cli autorun --config=.lighthouserc.js || {
          echo "⚠️  Lighthouse CI found budget violations"
          echo "💡 Review the report and fix performance regressions before merging"
          exit 1
        }
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: Upload Lighthouse report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-report
        path: .lighthouseci
